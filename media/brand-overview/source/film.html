<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>品牌战略分析 · 研究理念影片</title>
  <style>
    :root { color-scheme: light; font-family: "Microsoft YaHei UI", "PingFang SC", sans-serif; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; background: #eceee5; color: #2b3d34; display: grid; place-content: center; }
    canvas { display: block; width: min(100vw, 1440px); height: auto; background: #f6f3e9; }
    .controls { padding: 14px 20px; display: flex; gap: 16px; align-items: center; }
    button { border: 0; border-radius: 8px; padding: 10px 18px; background: #526f5c; color: #fffef7; font: inherit; cursor: pointer; }
    button:disabled { opacity: .5; cursor: wait; }
    input { flex: 1; accent-color: #718f7b; }
    output { min-width: 90px; font-size: 13px; color: #60705f; }
    [role="status"] { margin: 0; padding: 0 20px 16px; color: #60705f; font-size: 13px; }
    @media (prefers-reduced-motion: reduce) { * { scroll-behavior: auto; } }
  </style>
</head>
<body>
  <main>
    <canvas id="film" width="1920" height="1080" aria-label="品牌战略分析研究理念影片，讲解多方视角、最小单元与八项基石原则，包含虚构教学示例"></canvas>
    <div class="controls">
      <button id="play" disabled>播放预览</button>
      <input id="seek" type="range" min="0" max="100" step="0.05" value="0" aria-label="影片时间">
      <output id="clock">加载中</output>
    </div>
    <p id="status" role="status">正在读取时间线与旁白。</p>
  </main>
  <audio id="narration" preload="auto"></audio>
  <script src="film.js?v=coherent-20261025-1"></script>
</body>
</html>
